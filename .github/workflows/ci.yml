name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Formatação
        run: test -z "$(gofmt -l .)"
      - name: Vet (Linux e Windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Testes
        run: go test ./...
      - name: Compilar para Windows
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || VERSAO="dev-${GITHUB_SHA::7}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.versao=${VERSAO} -X main.servidorPadrao=${{ vars.CQR_SERVIDOR_PADRAO }}" \
            -o dist/cqrprint.exe ./cmd/cqrprint
      - uses: actions/upload-artifact@v4
        with:
          name: cqrprint-windows
          path: dist/cqrprint.exe

  versao:
    # Tag v1.2.3: publica o cqrprint.exe como versão no GitHub (o Desk aponta para a última).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cqrprint-windows
          path: dist
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/cqrprint.exe --repo "$GITHUB_REPOSITORY" --title "CQR Print $GITHUB_REF_NAME" --generate-notes
